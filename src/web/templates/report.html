<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório do Scan - AWS Security Scanner</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS customizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🔐 AWS Security Scanner</span>
            <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-light">← Voltar ao Dashboard</a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Cabeçalho do relatório -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Relatório do Scan #<span id="scan-id">{{ scan_id }}</span></h2>
                <p class="text-muted mb-0">Data: <span id="scan-date">{{ scan_date }}</span></p>
            </div>
            <div>
                <button id="export-csv" class="btn btn-outline-secondary">Exportar CSV</button>
                <button id="export-pdf" class="btn btn-outline-danger ms-2">Exportar PDF</button>
            </div>
        </div>

        <!-- Cards de resumo do scan -->
        <div class="row mb-4" id="report-summary">
            <!-- Preenchido via JavaScript -->
        </div>

        <!-- Filtros -->
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Severidade</label>
                        <select id="filter-severity" class="form-select">
                            <option value="all">Todas</option>
                            <option value="CRITICAL">CRITICAL</option>
                            <option value="HIGH">HIGH</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="LOW">LOW</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipo de recurso</label>
                        <select id="filter-resource" class="form-select">
                            <option value="all">Todos</option>
                            <!-- Opções preenchidas via JavaScript -->
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Buscar</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Buscar por ID ou detalhe...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de findings -->
        <div class="card shadow-sm">
            <div class="card-body table-responsive">
                <table class="table table-hover align-middle" id="report-table">
                    <thead class="table-light">
                        <tr>
                            <th>Recurso</th>
                            <th>ID</th>
                            <th>Risco</th>
                            <th>Detalhe</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript específico do relatório -->
    <script src="{{ url_for('static', filename='js/report.js') }}"></script>
</body>
</html>
