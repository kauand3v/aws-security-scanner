<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AWS Security Scanner</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- CSS customizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🔐 AWS Security Scanner</span>
            <a href="{{ url_for('dashboard') }}" class="text-light text-decoration-none">Dashboard</a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Cards de resumo -->
        <div class="row" id="summary-cards">
            <!-- Preenchido via JavaScript -->
        </div>

        <!-- Gráficos -->
        <div class="row mt-4">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Riscos por severidade (último scan)</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="severityChart" height="200"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Histórico de scans</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="historyChart" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de findings -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Findings do último scan</h5>
                        <div>
                            <select id="filter-severity" class="form-select form-select-sm d-inline-block w-auto">
                                <option value="all">Todas as severidades</option>
                                <option value="CRITICAL">CRITICAL</option>
                                <option value="HIGH">HIGH</option>
                                <option value="MEDIUM">MEDIUM</option>
                                <option value="LOW">LOW</option>
                            </select>
                            <button id="export-csv" class="btn btn-sm btn-outline-secondary ms-2">Exportar CSV</button>
                        </div>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-hover align-middle" id="findings-table">
                            <thead class="table-light">
                                <tr>
                                    <th>Recurso</th>
                                    <th>ID</th>
                                    <th>Risco</th>
                                    <th>Detalhe</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Preenchido via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript customizado -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
